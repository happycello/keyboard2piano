<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111112"><meta name="description" content="An offline-ready sampled piano for your computer keyboard. White-key and numbered-note modes, English and Chinese."><title>keyboard2piano · 键间</title><link rel="stylesheet" href="style.css?v=20261102-library2"></head>
<body><main><header><a class="brand" href="index.html">keyboard<span>2</span>piano <small>键间</small></a><button id="language" aria-label="Switch to Chinese">中文</button></header>
<section class="intro"><div class="eyebrow" data-i18n="eyebrow"></div><h1 data-i18n="headline"></h1><p data-i18n="subtitle"></p></section>
<section id="instrumentBoard" tabindex="0" class="instrument" aria-label="Piano"><div class="toolbar"><div class="tabs" role="group" aria-label="Playing mode"><button id="mainMode" class="selected" data-i18n="mainMode"></button><button id="numMode" data-i18n="numMode"></button></div><button id="start" class="primary" data-i18n="start"></button></div>
<div class="settings"><label><span data-i18n="voice"></span><select id="voice" aria-label="Instrument"><option value="piano" data-i18n="pianoVoice"></option><option value="violin" data-i18n="violinVoice"></option><option value="cello" data-i18n="celloVoice"></option><option value="flute" data-i18n="fluteVoice"></option></select></label><label><span data-i18n="range"></span><select id="octave" aria-label="Starting octave"></select></label><label><span data-i18n="volume"></span><input id="volume" aria-label="Volume" type="range" min="0" max="100" value="65"><output id="volumeValue" for="volume">65%</output></label><label><span data-i18n="brightness"></span><input id="brightness" aria-label="Tone brightness" type="range" min="2500" max="16000" value="11000"></label><label><span data-i18n="comboWindow"></span><input id="comboWindow" type="range" min="0" max="120" step="5" value="60" aria-label="Combination tolerance"><output id="comboValue" for="comboWindow">60 ms</output></label><button id="stop" data-i18n="stop"></button></div>
<div class="wheel-controls"><label><input id="wheelVolume" type="checkbox" checked><span data-i18n="wheelVolume"></span></label><span data-i18n="wheelHelp"></span><button id="keyboardFocus" data-i18n="keyboardFocus"></button></div><p id="inputStatus" class="input-status" role="status"></p><div class="input-trace"><span id="lastKey"></span><span id="lastSound"></span></div><div class="readout"><span id="status" role="status"></span><strong id="notes" aria-live="off">—</strong></div>
<div class="fallboard"><div class="maker">KEYBOARD<span>2</span>PIANO</div><span id="soundBadge" class="sample-badge"></span></div>
<div class="piano-wrap"><div id="piano"></div></div>
<div id="gameHud" class="game-prompt"><div><span data-i18n="pressKeys"></span><small id="hudSongTitle"></small></div><strong id="lessonKeys">—</strong><div><span id="lessonGameStats"></span><strong id="lessonJudgement" role="status"></strong><button id="quickLessonStart" data-i18n="startLesson"></button></div></div><div class="mapping-heading"><span data-i18n="mapping"></span><span data-i18n="mappingDetail"></span></div><div id="keyboard"></div>
<div class="pedals"><button data-pedal="quiet" aria-pressed="false"><small>CTRL</small><b data-i18n="quiet"></b><span data-i18n="quietDetail"></span></button><button data-pedal="soft" aria-pressed="false"><small>ALT</small><b data-i18n="soft"></b><span data-i18n="softDetail"></span></button><button data-pedal="sustain" aria-pressed="false"><small>SPACE</small><b data-i18n="sustain"></b><span data-i18n="sustainDetail"></span></button></div>
<p id="hint" class="hint"></p></section>

<section class="studio-panel" id="teaching"><div class="panel-title"><div><div class="eyebrow" data-i18n="lessonEyebrow"></div><h2 data-i18n="lessonHeading"></h2></div><button id="demoLesson" data-i18n="demoTitle"></button></div>
<details id="songLibraryPanel" class="library-details"><summary data-i18n="libraryHeading"></summary><div class="library-controls"><input id="songSearch" type="search" aria-label="Search songs"><select id="songGenre" aria-label="Song genre"><option value="all" data-i18n="genreAll"></option><option value="folk" data-i18n="genreFolk"></option><option value="classical" data-i18n="genreClassical"></option><option value="dance" data-i18n="genreDance"></option><option value="anime" data-i18n="genreAnime"></option><option value="pop" data-i18n="genrePop"></option></select><select id="songDifficulty" aria-label="Difficulty"><option value="all" data-i18n="difficultyAll"></option><option value="beginner" data-i18n="beginner"></option><option value="intermediate" data-i18n="intermediate"></option><option value="advanced" data-i18n="advanced"></option><option value="import" data-i18n="needsImport"></option></select><span id="songCount"></span></div><p class="hint" data-i18n="libraryHelp"></p><div id="songGrid" class="song-grid"></div><div class="library-paging"><button id="songPrev" data-i18n="previousPage"></button><span id="songPage"></span><button id="songNext" data-i18n="nextPage"></button></div></details><p id="libraryMessage" role="status"></p><p data-i18n="lessonHelp"></p>
<div class="lesson-controls"><label><span data-i18n="practiceMode"></span><select id="lessonMode"><option value="wait" data-i18n="waitMode"></option><option value="tempo" data-i18n="tempoMode"></option></select></label><label>BPM <input id="lessonTempo" type="number" min="30" max="240" value="100" aria-label="Tempo"></label><button id="lessonStart" class="primary" data-i18n="startLesson"></button><button id="lessonListen" data-i18n="listenLesson"></button><button id="lessonReset" data-i18n="resetLesson"></button></div>
<div class="lesson-now"><div><small data-i18n="nextNotes"></small><strong id="lessonTarget"></strong></div><span id="lessonCount"></span></div>
<p id="lessonAdvice" class="hint" role="status"></p><div id="lessonTitle"></div><div id="lessonStrip" class="score-strip"></div><input id="lessonSeek" type="range" min="0" max="1" value="0" aria-label="Score position">
<details><summary data-i18n="importScore"></summary><p data-i18n="scoreFormats"></p><label class="melody-option"><input id="melodyImport" type="checkbox" checked><span data-i18n="melodyImport"></span></label><label class="file-label"><span data-i18n="chooseScore"></span><input id="scoreFile" type="file" accept=".mid,.midi,.xml,.musicxml,.txt,.json"></label><label for="scoreText" data-i18n="scoreTextLabel"></label><textarea id="scoreText" rows="3" spellcheck="false">1 1 5 5 6 6 5:2 4 4 3 3 2 2 1:2</textarea><p data-i18n="scoreSyntax"></p><button id="applyScore" data-i18n="applyScore"></button></details><p id="scoreMessage" role="status"></p></section>
<section class="studio-panel" id="transcription"><div class="panel-title"><div><div class="eyebrow" data-i18n="transcribeEyebrow"></div><h2 data-i18n="transcribeHeading"></h2></div><span class="experimental" data-i18n="experimental"></span></div><p data-i18n="transcribeHelp"></p><p class="transcription-limit" data-i18n="transcribeLimit"></p>
<div class="lesson-controls"><label class="file-label"><span data-i18n="chooseAudio"></span><input id="audioFile" type="file" accept="audio/*"></label><button id="liveAudio" data-i18n="liveAudio" disabled></button><button id="microphone" data-i18n="microphone"></button><button id="cancelTranscription" data-i18n="stopTranscription" disabled></button></div>
<div class="lesson-now"><strong id="pitchReadout">—</strong><span id="transcriptCount"></span></div><progress id="transcriptionProgress" value="0" max="100" aria-label="Transcription progress"></progress><p id="transcriptStatus" role="status"></p><div id="transcriptNotes" class="transcript-notes"></div><div class="lesson-controls"><button id="useTranscript" data-i18n="useTranscript" disabled></button><button id="exportTranscript" data-i18n="exportTranscript" disabled></button></div></section>
<footer><div><span data-i18n="tipsTitle"></span><p data-i18n="tips"></p><p data-i18n="limits"></p></div><a href="THIRD_PARTY_NOTICES.md" data-i18n="credits"></a></footer></main><script src="i18n.js?v=20261102-library2"></script><script src="samples.js"></script><script src="instrument-samples.js"></script><script src="music-core.js"></script><script src="studio-i18n.js?v=20261102-library2"></script><script src="key-composer.js?v=20261102-library2"></script><script src="app.js?v=20261102-library2"></script><script src="teaching.js?v=20261102-library2"></script><script src="song-library.js?v=20261102-library2"></script><script src="library.js?v=20261102-library2"></script><script src="transcription.js"></script></body></html>
